$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
display_name: wkr-hypoforge-forecast-challenger
experiment_name: wkr-hypoforge-forecast
code: ../..
command: >-
  Rscript R/generate_sales_daily_de.R &&
  python experiments/hypoforge_forecast/run.py
  --sales data/sales/sales_daily_de.csv
  --calendar ${{inputs.calendar}}
  --market ${{inputs.market}}
  --output-dir ${{outputs.analysis}}
inputs:
  calendar:
    type: uri_file
    path: ../../data/raw/datumlanderferienfeiertage.csv
  market:
    type: uri_file
    path: ../../data/raw/automotive_market_de.csv
outputs:
  analysis:
    type: uri_folder
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: environment.yml
compute: azureml:cpu-cluster
